<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos de FakeStore</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        #productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .producto {
            background-color: #f8f8f8;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .producto img {
            max-width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 5px;
        }

        .producto h2 {
            font-size: 1.2em;
            margin: 10px 0 5px;
        }
    </style>
</head>
<body>
    <h1>Productos desde FakeStore</h1>
    <p id="mensaje">Cargando productos...</p>
    <div id="productos"></div>
    <script src="./asyncronismo-dom.js"></script>
</body>
</html>
